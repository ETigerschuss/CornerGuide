name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build and deploy are separate jobs: when the deploy step ran in the same
  # job right after the upload, GitHub sometimes did not list the fresh
  # artifact yet ("No artifacts named github-pages were found") and the
  # deploy failed until it was re-run by hand.
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The app compares this number with the server's copy to notice updates.
      - name: Stamp build number
        run: |
          BUILD="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          sed -i "s|<meta name=\"cg-build\" content=\"dev\" />|<meta name=\"cg-build\" content=\"${BUILD}\" />|" index.html
          grep -q "content=\"${BUILD}\"" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        continue-on-error: true
        uses: actions/deploy-pages@v4
      # GitHub can still be a moment late with the artifact: wait, then try once more.
      - name: Wait before retrying
        if: steps.deployment.outcome == 'failure'
        run: sleep 30
      - name: Deploy to GitHub Pages (second try)
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v4
