name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      # The app compares this number with the server's copy to notice updates.
      - name: Stamp build number
        run: |
          BUILD="${GITHUB_SHA::7}-${GITHUB_RUN_NUMBER}"
          sed -i "s|<meta name=\"cg-build\" content=\"dev\" />|<meta name=\"cg-build\" content=\"${BUILD}\" />|" index.html
          grep -q "content=\"${BUILD}\"" index.html
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
