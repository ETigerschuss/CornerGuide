name: Deploy Firebase (Regeln & Functions)

# Deploys the Realtime Database rules, Storage rules and Cloud Functions to the
# Firebase project whenever they change on main (or by hand via "Run workflow").
# Needs ONE repository secret (see README, "Automatisches Firebase-Deployment"):
#   FIREBASE_SERVICE_ACCOUNT  – JSON key of the Firebase Admin SDK service account, or
#   FIREBASE_TOKEN            – token from `npx firebase-tools login:ci`
# Without a secret the job only leaves a notice and succeeds.

on:
  push:
    branches: ["main"]
    paths:
      - "firebase.database.rules.json"
      - "storage.rules"
      - "firebase.json"
      - "functions/**"
      - ".github/scripts/**"
      - ".github/workflows/firebase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
      HAS_TOKEN: ${{ secrets.FIREBASE_TOKEN != '' }}
    steps:
      - name: Zugangsdaten vorhanden?
        id: creds
        run: |
          if [ "$HAS_SA" = "true" ] || [ "$HAS_TOKEN" = "true" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Firebase-Deploy übersprungen::Kein Secret FIREBASE_SERVICE_ACCOUNT oder FIREBASE_TOKEN hinterlegt – siehe README, Abschnitt 'Automatisches Firebase-Deployment'."
          fi

      - uses: actions/checkout@v4
        if: steps.creds.outputs.ok == 'true'

      - uses: actions/setup-node@v4
        if: steps.creds.outputs.ok == 'true'
        with:
          node-version: 20

      - name: Service-Account-Schlüssel bereitstellen
        if: steps.creds.outputs.ok == 'true' && env.HAS_SA == 'true'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        if: steps.creds.outputs.ok == 'true'
        run: npm ci --prefix functions

      # With the service-account key the rules go out through the Firebase Admin
      # SDK: `firebase deploy` would first query Google's Service Usage API,
      # which the Admin SDK account is not allowed to read.
      - name: Datenbank-Regeln deployen
        id: db
        if: steps.creds.outputs.ok == 'true' && env.HAS_SA == 'true'
        run: NODE_PATH=functions/node_modules node .github/scripts/deploy-rules.cjs database

      - name: Storage-Regeln deployen
        id: storage
        if: steps.creds.outputs.ok == 'true' && env.HAS_SA == 'true'
        continue-on-error: true
        run: NODE_PATH=functions/node_modules node .github/scripts/deploy-rules.cjs storage

      - name: Regeln deployen (Token)
        id: rules_token
        if: steps.creds.outputs.ok == 'true' && env.HAS_SA != 'true'
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@13 deploy --only database,storage --project cornerguide --non-interactive

      # Needs the Blaze plan and Cloud Functions rights for the account (see
      # README). Non-blocking so the rules above stay deployed either way;
      # --force answers the non-interactive prompts (e.g. image cleanup policy).
      - name: Cloud Functions deployen
        id: functions
        if: steps.creds.outputs.ok == 'true'
        continue-on-error: true
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: npx --yes firebase-tools@13 deploy --only functions --project cornerguide --non-interactive --force

      - name: Zusammenfassung
        if: always() && steps.creds.outputs.ok == 'true'
        env:
          DB: ${{ env.HAS_SA == 'true' && steps.db.outcome || steps.rules_token.outcome }}
          STORAGE: ${{ env.HAS_SA == 'true' && steps.storage.outcome || steps.rules_token.outcome }}
          FUNCTIONS: ${{ steps.functions.outcome }}
        run: |
          {
            echo "### Firebase-Deploy"
            echo "| Teil | Ergebnis |"
            echo "|---|---|"
            echo "| Datenbank-Regeln | $DB |"
            echo "| Storage-Regeln | $STORAGE |"
            echo "| Cloud Functions | $FUNCTIONS |"
          } >> "$GITHUB_STEP_SUMMARY"
          [ "$STORAGE" = "success" ] || echo "::warning title=Storage-Regeln nicht deployt::Siehe Log des Schritts 'Storage-Regeln deployen'."
          [ "$FUNCTIONS" = "success" ] || echo "::warning title=Cloud Functions nicht deployt::Meist fehlen dem Dienstkonto IAM-Rollen – siehe README, 'Automatisches Firebase-Deployment'."

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json"
