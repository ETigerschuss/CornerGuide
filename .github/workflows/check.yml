name: Checks

# Runs on every pull request and push: index.html must be built from src/,
# the code must parse and the database rules must be valid JSON.
on:
  pull_request:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build check, syntax, rules
        run: node tools/check.mjs
