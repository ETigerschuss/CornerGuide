name: Admin-Werkzeuge

# Manual admin jobs with the Firebase service account (secret FIREBASE_SERVICE_ACCOUNT):
#   add-admin        – give a Firebase user ID admin rights in the app (config/admins)
#   export-feedback  – export comments + check-in feedback, encrypted with the given
#                      public key, to the branch "admin-export" (repo and logs are public!)
#   cleanup-export   – delete the "admin-export" branch again
#   data-sizes       – size and number of entries per database node (no content)
#   phase1-backfill  – fill the slim copies the app reads at startup (pointsLite,
#                      visitStats, photoCovers …; see functions/lite.js), then data-sizes

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Aktion"
        type: choice
        options: ["add-admin", "export-feedback", "cleanup-export", "data-sizes", "phase1-backfill"]
        required: true
      uid:
        description: "Firebase-Nutzer-ID (für add-admin, steht im Profil unter „Konto & Profil sichern“)"
        required: false
        default: ""
      pubkey:
        description: "Öffentlicher RSA-Schlüssel als Base64-PEM (für export-feedback)"
        required: false
        default: ""

permissions:
  contents: write   # only used to push / delete the encrypted "admin-export" branch

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      HAS_SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' }}
    steps:
      - name: Export-Branch löschen
        if: inputs.action == 'cleanup-export'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git init -q "$RUNNER_TEMP/cleanup" && cd "$RUNNER_TEMP/cleanup"   # git push needs a repository
          if git ls-remote --exit-code "$url" refs/heads/admin-export >/dev/null; then
            git push -q "$url" --delete admin-export
            echo "✔ Export-Branch gelöscht."
          else
            echo "Kein Export-Branch vorhanden."
          fi

      - name: Zugangsdaten prüfen
        if: inputs.action != 'cleanup-export'
        run: |
          if [ "$HAS_SA" != "true" ]; then echo "::error::Secret FIREBASE_SERVICE_ACCOUNT fehlt."; exit 1; fi

      - uses: actions/checkout@v4
        if: inputs.action != 'cleanup-export'

      - uses: actions/setup-node@v4
        if: inputs.action != 'cleanup-export'
        with:
          node-version: 22

      - name: Service-Account-Schlüssel bereitstellen
        if: inputs.action != 'cleanup-export'
        env:
          SA_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          printf '%s' "$SA_KEY" > "$RUNNER_TEMP/firebase-sa.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-sa.json" >> "$GITHUB_ENV"

      - name: Abhängigkeiten installieren
        if: inputs.action != 'cleanup-export'
        run: npm ci --prefix functions

      - name: Aktion ausführen
        if: inputs.action != 'cleanup-export'
        env:
          ACTION: ${{ inputs.action }}
          UID_INPUT: ${{ inputs.uid }}
          PUBKEY_B64: ${{ inputs.pubkey }}
          EXPORT_FILE: ${{ runner.temp }}/export.b64
        run: NODE_PATH=functions/node_modules node .github/scripts/admin-tools.cjs

      - name: Verschlüsselten Export ablegen
        if: inputs.action == 'export-feedback'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir "$RUNNER_TEMP/export-repo" && cd "$RUNNER_TEMP/export-repo"
          git init -q && cp "$RUNNER_TEMP/export.b64" export.b64
          git add export.b64
          git -c user.name="cornerguide-admin-tools" -c user.email="actions@users.noreply.github.com" commit -q -m "Encrypted feedback export"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:refs/heads/admin-export
          echo "✔ Verschlüsselter Export liegt auf dem Branch admin-export."

      - name: Schlüssel entfernen
        if: always()
        run: rm -f "$RUNNER_TEMP/firebase-sa.json" "$RUNNER_TEMP/export.b64"
